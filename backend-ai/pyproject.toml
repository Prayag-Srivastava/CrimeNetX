[project]
name = "crimenetx-backend-ai"
version = "1.0.0"
description = "CrimeNetX AI/ML service — NLP, Graph ML, LangGraph agents, dossier generation (SIH26189)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "networkx>=3.4",
    "scikit-learn>=1.6",
    "reportlab>=4.2",
    "groq>=0.13",
    "google-generativeai>=0.8",
    "chromadb>=0.5",
    "loguru>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
