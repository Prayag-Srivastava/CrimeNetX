# ============================================================================
# CrimeNetX — Docker Compose (SIH26189)
# Spins up: PostgreSQL 16, Redis 7, ChromaDB, backend-node, backend-ai, frontend
# Usage:  docker compose up --build
# ============================================================================

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16-alpine
    container_name: crimenetx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimenetx
      POSTGRES_PASSWORD: crimenetx
      POSTGRES_DB: crimenetx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimenetx -d crimenetx"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- cache
  redis:
    image: redis:7-alpine
    container_name: crimenetx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ vector store
  chromadb:
    image: chromadb/chroma:latest
    container_name: crimenetx-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"   # host 8001 to avoid clash with FastAPI on 8000
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ neo4j graph db
  neo4j:
    image: neo4j:5.26.0-community
    container_name: crimenetx-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j HTTP Browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/crimenetx_neo4j_pass
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------- Node REST + WS API
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: crimenetx-backend-node
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend-node/.env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_W3VaxoY5rbNg@ep-plain-poetry-azioxp85-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://backend-ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evidence_uploads:/app/uploads
    command: ["npm", "run", "start"]

  # --------------------------------------------------------- FastAPI AI/ML API
  backend-ai:
    build:
      context: ./backend-ai
      args:
        HF_TOKEN: ${HF_TOKEN}
      dockerfile: Dockerfile
      secrets:
        - hf_token
    container_name: crimenetx-backend-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend-ai/.env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_W3VaxoY5rbNg@ep-plain-poetry-azioxp85-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      REDIS_URL: redis://redis:6379
      NODE_BACKEND_URL: http://backend-node:5000
      CHROMA_PERSIST_DIR: /data/chroma
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: crimenetx_neo4j_pass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - chroma_data:/data/chroma
      - evidence_uploads:/app/evidence
    

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: crimenetx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend-node
      - backend-ai

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
  evidence_uploads:

secrets:
  hf_token:
    environment: HF_TOKEN
