# ============================================================================
# CrimeNetX — Docker Compose (SIH26189)
# Spins up: PostgreSQL 16, Redis 7, ChromaDB, backend-node, backend-ai, frontend
# Usage:  docker compose up --build
# ============================================================================
version: "3.9"

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16-alpine
    container_name: crimenetx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crimenetx
      POSTGRES_PASSWORD: crimenetx
      POSTGRES_DB: crimenetx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimenetx -d crimenetx"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- cache
  redis:
    image: redis:7-alpine
    container_name: crimenetx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------ vector store
  chromadb:
    image: chromadb/chroma:latest
    container_name: crimenetx-chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"   # host 8001 to avoid clash with FastAPI on 8000
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------- Node REST + WS API
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: crimenetx-backend-node
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend-node/.env
    environment:
      DATABASE_URL: postgresql://crimenetx:crimenetx@postgres:5432/crimenetx?schema=public
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://backend-ai:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evidence_uploads:/app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start"

  # --------------------------------------------------------- FastAPI AI/ML API
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: crimenetx-backend-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend-ai/.env
    environment:
      DATABASE_URL: postgresql://crimenetx:crimenetx@postgres:5432/crimenetx?schema=public
      REDIS_URL: redis://redis:6379
      NODE_BACKEND_URL: http://backend-node:5000
      CHROMA_PERSIST_DIR: /data/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/data/chroma
      - evidence_uploads:/app/evidence

  # ---------------------------------------------------------------- frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: crimenetx-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend-node
      - backend-ai

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  evidence_uploads:
