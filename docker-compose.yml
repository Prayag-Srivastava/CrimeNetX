# ============================================================================
# CrimeNetX — Docker Compose (Development)
# PostgreSQL 16 + Redis 7 + ChromaDB + Neo4j + Node + FastAPI AI + Next.js
#
# First time / dependency changes:
#   docker compose build
#
# Normal development:
#   docker compose up -d
#
# Code changes:
#   No Docker rebuild required.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: crimenetx-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: crimenetx
      POSTGRES_PASSWORD: crimenetx
      POSTGRES_DB: crimenetx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crimenetx -d crimenetx"]
      interval: 5s
      timeout: 5s
      retries: 10


  # --------------------------------------------------------------------------
  # Redis
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: crimenetx-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  # --------------------------------------------------------------------------
  # ChromaDB
  # --------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: crimenetx-chromadb
    restart: unless-stopped

    ports:
      - "8001:8000"

    volumes:
      - chroma_data:/data

    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"

    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # --------------------------------------------------------------------------
  # Neo4j Graph Database
  # --------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.26.0-community
    container_name: crimenetx-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/crimenetx_neo4j_pass

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # --------------------------------------------------------------------------
  # Node REST + WebSocket API
  # --------------------------------------------------------------------------
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile

    container_name: crimenetx-backend-node
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend-node/.env

    environment:

      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://backend-ai:8000
      NODE_ENV: development

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      # Live source code
      - ./backend-node:/app

      # Keep Linux node_modules inside Docker
      - backend_node_modules:/app/node_modules

      # Persistent uploaded evidence
      - evidence_uploads:/app/uploads

    # Development watcher
    command: npm run dev


    # --------------------------------------------------------------------------
  # FastAPI AI / ML API
  # --------------------------------------------------------------------------
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
      secrets:
        - hf_token

    container_name: crimenetx-backend-ai
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend-ai/.env

    environment:
      # Add your actual DATABASE_URL here or keep it in .env

      REDIS_URL: redis://redis:6379
      NODE_BACKEND_URL: http://backend-node:5000

      CHROMA_PERSIST_DIR: /data/chroma

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: crimenetx_neo4j_pass

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      neo4j:
        condition: service_healthy

      chromadb:
        condition: service_healthy

    volumes:
      # Live Python source code
      - ./backend-ai:/app

      # Persistent Chroma data
      - chroma_data:/data/chroma

      # Persistent evidence
      - evidence_uploads:/app/evidence

    # FastAPI automatically reloads when Python source changes
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload


  # --------------------------------------------------------------------------
  # Next.js Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev

    container_name: crimenetx-frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./frontend/.env.local

    environment:
      NODE_ENV: development

    depends_on:
      - backend-node
      - backend-ai

    volumes:
      # Live frontend source
      - ./frontend:/app

      # Shared code
      - ./shared:/shared

      # Keep Linux node_modules inside Docker
      - frontend_node_modules:/app/node_modules

      # Next.js cache
      - frontend_next:/app/.next

    # Next.js development server / hot reload
    command: ["npm", "run", "dev"]


# ============================================================================
# Persistent volumes
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  neo4j_data:
  evidence_uploads:

  # Node dependencies
  backend_node_modules:
  frontend_node_modules:

  # Next.js cache
  frontend_next:


# ============================================================================
# Build secrets
# ============================================================================
secrets:
  hf_token:
    environment: HF_TOKEN